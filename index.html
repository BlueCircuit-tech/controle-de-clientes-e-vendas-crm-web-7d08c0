<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MobiServ — Painel de Controle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#eef1f7', 100: '#d4dae8', 200: '#a9b5d1',
              300: '#7e90ba', 400: '#536ba3', 500: '#2c3e6b',
              600: '#253566', 700: '#1e2c60', 800: '#17233a',
              900: '#0f1928', 950: '#0a1120',
            },
            destaque: {
              50: '#fef7ee', 100: '#fdeccd', 200: '#fbd99b',
              300: '#f8c569', 400: '#f5b137', 500: '#f59e0b',
              600: '#e08d0b', 700: '#b97209', 800: '#8c5707',
              900: '#603c05',
            },
            cinza: { 25: '#fafbfc', 50: '#f4f5f7', 100: '#ebedf0', 200: '#d1d5db', 300: '#9ca3af', 400: '#6b7280', 500: '#4b5563', 600: '#374151', 700: '#1f2937', 800: '#111827', 900: '#030712' }
          },
          fontFamily: { display: ['Syne','sans-serif'], body: ['Outfit','sans-serif'] },
          boxShadow: { card: '0 1px 3px rgba(10,17,32,.08),0 1px 2px rgba(10,17,32,.04)', cardHover: '0 10px 25px rgba(10,17,32,.10),0 4px 10px rgba(10,17,32,.06)', lift: '0 20px 40px rgba(10,17,32,.14),0 8px 16px rgba(10,17,32,.08)', soft: '0 4px 6px rgba(10,17,32,.05),0 2px 4px rgba(10,17,32,.03)' },
          borderRadius: { xl: '1rem', '2xl': '1.25rem', '3xl': '1.5rem' }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { font-family: 'Outfit', sans-serif; background: #f4f5f7; overflow: hidden; height: 100vh; }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    :focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; border-radius: 6px; }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    [data-tela]:not(.hidden) { animation: fadeSlideIn .35s cubic-bezier(.22,.61,.36,1) both; }

    .badge { display: inline-flex; align-items: center; padding: .2rem .75rem; font-size: .75rem; font-weight: 600; border-radius: 9999px; white-space: nowrap; }
    .badge-ok  { background: #dcfce7; color: #166534; }
    .badge-err { background: #fee2e2; color: #991b1b; }
    .badge-avs { background: #fef3c7; color: #92400e; }
    .badge-inf { background: #dbeafe; color: #1e40af; }
    .badge-nwl { background: #ede9fe; color: #5b21b6; }

    .card { background: #fff; border-radius: 1.25rem; box-shadow: 0 1px 3px rgba(10,17,32,.08),0 1px 2px rgba(10,17,32,.04); transition: box-shadow .25s ease, transform .25s ease; }
    .card:hover { box-shadow: 0 10px 25px rgba(10,17,32,.10),0 4px 10px rgba(10,17,32,.06); }
    .card-inter { cursor: pointer; }
    .card-inter:hover { transform: translateY(-3px); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-family: 'Outfit',sans-serif; font-weight: 600; border-radius: .75rem; transition: all .2s ease; cursor: pointer; border: none; font-size: .875rem; }
    .btn:active { transform: scale(.97); }
    .btn-primary { background: linear-gradient(135deg,#f59e0b,#e08d0b); color: #fff; padding: .65rem 1.5rem; box-shadow: 0 4px 14px rgba(245,158,11,.35); }
    .btn-primary:hover { box-shadow: 0 6px 20px rgba(245,158,11,.45); transform: translateY(-1px); }
    .btn-ghost { background: transparent; color: #4b5563; padding: .65rem 1.5rem; border: 1.5px solid #e5e7eb; }
    .btn-ghost:hover { background: #f4f5f7; border-color: #d1d5db; }
    .btn-danger { background: #fee2e2; color: #991b1b; padding: .5rem 1.25rem; }
    .btn-danger:hover { background: #fecaca; }
    .btn-sm { padding: .4rem 1rem; font-size: .8125rem; border-radius: .625rem; }

    .ativo { background: linear-gradient(135deg,rgba(245,158,11,.15),rgba(245,158,11,.08)); color: #f59e0b !important; position: relative; }
    .ativo::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: linear-gradient(180deg,#f59e0b,#e08d0b); border-radius: 0 4px 4px 0; }

    #toasts { position: fixed; top: 1.25rem; right: 1.25rem; z-index: 9999; display: flex; flex-direction: column; gap: .6rem; pointer-events: none; }
    .toast-item { display: flex; align-items: center; gap: .75rem; padding: .85rem 1.25rem; border-radius: .875rem; box-shadow: 0 10px 40px rgba(10,17,32,.15); pointer-events: all; animation: toastIn .3s ease both; font-size: .875rem; font-weight: 500; max-width: 380px; }
    .toast-item.sair { animation: toastOut .28s ease both; }
    .toast-ok  { background: #065f46; color: #ecfdf5; }
    .toast-err { background: #991b1b; color: #fef2f2; }
    .toast-inf { background: #1e3a5f; color: #eff6ff; }

    @keyframes toastIn { from { opacity: 0; transform: translateX(40px) scale(.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
    @keyframes toastOut { from { opacity: 1; transform: translateX(0); } to { opacity: 0; transform: translateX(60px); } }

    #modal-bg { position: fixed; inset: 0; background: rgba(10,17,32,.55); backdrop-filter: blur(3px); z-index: 9000; display: none; align-items: center; justify-content: center; padding: 1.5rem; }
    #modal-bg.aberto { display: flex; animation: modalFade .2s ease both; }
    @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
    #modal-card { background: #fff; border-radius: 1.25rem; box-shadow: 0 25px 60px rgba(10,17,32,.25); width: 100%; max-width: 520px; max-height: 85vh; display: flex; flex-direction: column; animation: modalCard .28s cubic-bezier(.22,.61,.36,1) both; }
    @keyframes modalCard { from { opacity: 0; transform: scale(.94) translateY(16px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    .sidebar { width: 270px; flex-shrink: 0; }
    .nav-btn { display: flex; align-items: center; gap: .75rem; width: 100%; padding: .6rem .85rem; border-radius: .625rem; font-size: .875rem; font-weight: 500; color: #a9b5d1; transition: all .18s ease; cursor: pointer; background: none; border: none; text-align: left; font-family: 'Outfit',sans-serif; }
    .nav-btn:hover { background: rgba(245,158,11,.08); color: #fbd99b; }
    .nav-btn svg { flex-shrink: 0; }

    .search-input { background: #17233a; border: 1.5px solid transparent; color: #fff; padding: .5rem 1rem .5rem 2.4rem; border-radius: .625rem; font-size: .875rem; width: 100%; transition: all .2s ease; font-family: 'Outfit',sans-serif; }
    .search-input::placeholder { color: #536ba3; }
    .search-input:focus { outline: none; border-color: #f59e0b; background: #1e2c60; }

    .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg,#f59e0b,#e08d0b); color: #fff; display: flex; align-items: center; justify-content: center; font-size: .8125rem; font-weight: 700; flex-shrink: 0; cursor: pointer; }

    .notif-btn { position: relative; width: 38px; height: 38px; border-radius: 50%; background: #17233a; border: none; color: #a9b5d1; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .2s ease; }
    .notif-btn:hover { background: #1e2c60; color: #fff; }
    .notif-dot { position: absolute; top: 7px; right: 7px; width: 9px; height: 9px; background: #f59e0b; border-radius: 50%; border: 2px solid #0f1928; }

    .stat-card { background: #fff; border-radius: 1.25rem; padding: 1.25rem 1.5rem; box-shadow: 0 1px 3px rgba(10,17,32,.08),0 1px 2px rgba(10,17,32,.04); transition: all .25s ease; border: 1px solid #f4f5f7; }
    .stat-card:hover { box-shadow: 0 10px 25px rgba(10,17,32,.10); transform: translateY(-2px); }
  </style>
</head>
<body class="flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="sidebar flex flex-col h-full" style="background:linear-gradient(180deg,#0f1928 0%,#17233a 50%,#1e2c60 100%);">
    <!-- Logo -->
    <div class="px-5 py-5 flex items-center gap-3">
      <svg width="38" height="38" viewBox="0 0 38 38" fill="none">
        <circle cx="19" cy="19" r="17" fill="url(#lg1)" stroke="#f59e0b" stroke-width="2.5" opacity=".35"/>
        <circle cx="19" cy="19" r="13" fill="url(#lg2)"/>
        <path d="M12 22 L19 12 L26 22" stroke="#fff" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M15 22 L19 17 L23 22" stroke="#0f1928" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="38" y2="38"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#f5b137" stop-opacity=".4"/></linearGradient><linearGradient id="lg2" x1="12" y1="12" x2="26" y2="26"><stop stop-color="#f59e0b"/><stop offset="1" stop-color="#e08d0b"/></linearGradient></defs>
      </svg>
      <div>
        <span class="font-display font-800 text-white text-lg leading-none tracking-tight block">MobiServ</span>
        <span class="text-marca-300 text-[.65rem] font-body font-500 tracking-widest uppercase">Painel</span>
      </div>
    </div>

    <div class="px-5 mb-2"><div class="h-px bg-marca-700/60"></div></div>

    <!-- Menu principal -->
    <nav class="flex-1 overflow-y-auto px-3 space-y-1">
      <button data-nav="painel-inicial" onclick="mostrarTela('painel-inicial')" class="nav-btn ativo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Painel Inicial
      </button>
      <button data-nav="catalogo-de-servicos" onclick="mostrarTela('catalogo-de-servicos')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
        Catálogo de Serviços
      </button>
      <button data-nav="detalhe-do-servico" onclick="mostrarTela('detalhe-do-servico')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Detalhe do Serviço
      </button>
      <button data-nav="agendar-servico" onclick="mostrarTela('agendar-servico')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Agendar Serviço
      </button>
      <button data-nav="acompanhar-servico" onclick="mostrarTela('acompanhar-servico')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        Acompanhar Serviço
      </button>

      <div class="pt-3 pb-1 px-1"><span class="text-[.65rem] font-600 text-marca-400 uppercase tracking-widest">Gestão</span></div>
      <button data-nav="gestao-de-clientes" onclick="mostrarTela('gestao-de-clientes')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
        Gestão de Clientes
      </button>
      <button data-nav="orcamentos-e-pedidos" onclick="mostrarTela('orcamentos-e-pedidos')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
        Orçamentos e Pedidos
      </button>

      <div class="pt-3 pb-1 px-1"><span class="text-[.65rem] font-600 text-marca-400 uppercase tracking-widest">Sistema</span></div>
      <button data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')" class="nav-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m4.22-10.22l4.24-4.24M6.34 6.34L2.1 2.1m17.8 17.8l-4.24-4.24M6.34 17.66l-4.24 4.24M23 12h-6m-6 0H1m20.07-4.93l-4.24 4.24M6.34 6.34l-4.24-4.24"/></svg>
        Painel Administrativo
      </button>
    </nav>

    <!-- Usuário -->
    <div class="px-4 py-4 border-t border-marca-700/60">
      <div class="flex items-center gap-3">
        <div class="avatar">RL</div>
        <div class="min-w-0">
          <p class="text-white text-sm font-600 truncate">Rafael Lima</p>
          <p class="text-marca-300 text-xs truncate">rafael@mobiserv.com</p>
        </div>
      </div>
    </div>
  </aside>

  <!-- CONTEÚDO PRINCIPAL -->
  <div class="flex-1 flex flex-col min-w-0 h-full">
    <!-- TOP BAR -->
    <header class="flex items-center justify-between px-8 py-3.5 bg-white border-b border-cinza-200 flex-shrink-0">
      <div class="relative w-96">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-cinza-300" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" class="search-input" placeholder="Buscar clientes, serviços, pedidos…">
        <kbd class="absolute right-3 top-1/2 -translate-y-1/2 text-cinza-300 text-[.6875rem] font-500 bg-marca-50 px-1.5 py-0.5 rounded border border-cinza-200">⌘K</kbd>
      </div>
      <div class="flex items-center gap-2">
        <button class="notif-btn" onclick="toast('Você tem 3 notificações pendentes','info')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-dot"></span>
        </button>
        <button class="notif-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        </button>
        <div class="w-px h-6 bg-cinza-200 mx-1.5"></div>
        <button class="flex items-center gap-2.5 px-2 py-1.5 rounded-xl hover:bg-cinza-50 transition-colors" onclick="mostrarTela('painel-administrativo')">
          <div class="avatar">RL</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-cinza-400"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
    </header>

    <!-- ÁREA DE TELAS -->
    <main class="flex-1 overflow-y-auto p-8">
      <!-- TELAS -->
    </main>
  </div>

  <!-- TOASTS -->
  <div id="toasts"></div>

  <!-- MODAL -->
  <div id="modal-bg" onclick="if(event.target===this)fecharModal()">
    <div id="modal-card">
      <div class="flex items-center justify-between px-6 py-4 border-b border-cinza-100">
        <h3 id="modal-titulo" class="font-display font-700 text-marca-800 text-lg"></h3>
        <button onclick="fecharModal()" class="w-8 h-8 flex items-center justify-center rounded-lg hover:bg-cinza-100 text-cinza-400 hover:text-cinza-600 transition-colors">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-corpo" class="p-6 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // ── ROTEADOR ─────────────────────────────────────────
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
      });
      document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.addEventListener('DOMContentLoaded', function () {
      mostrarTela('painel-inicial');
    });

    // ── TOASTS ──────────────────────────────────────────
    function toast(msg, tipo) {
      var icones = { ok: '✓', erro: '✕', info: 'ℹ' };
      var el = document.createElement('div');
      el.className = 'toast-item toast-' + (tipo || 'inf');
      el.innerHTML = '<span class="text-base">' + (icones[tipo] || 'ℹ') + '</span><span>' + msg + '</span>';
      document.getElementById('toasts').appendChild(el);
      setTimeout(function () { el.classList.add('sair'); }, 2700);
      setTimeout(function () { el.remove(); }, 3000);
    }

    // ── MODAL ───────────────────────────────────────────
    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-corpo').innerHTML = html;
      document.getElementById('modal-bg').classList.add('aberto');
    }
    function fecharModal() {
      document.getElementById('modal-bg').classList.remove('aberto');
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

    // ── UTILITÁRIOS ─────────────────────────────────────
    function brl(v) { return new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL' }).format(v); }
    function dataBR(iso) {
      if (!iso) return '—';
      var p = iso.split('-');
      return (p[2] || '').slice(0,2) + '/' + (p[1] || '') + '/' + (p[0] || '');
    }
  </script>
</body>
</html>
